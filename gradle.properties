org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Memory-constrained host (8 GB): cap daemon heap and parallel workers so builds
# cannot exhaust system memory. Raise only on a machine with more headroom.
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true

# Compile inside the bounded Gradle daemon heap instead of a second JVM.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode: more aggressive shrinking/optimization for smaller, faster releases.
android.enableR8.fullMode=true

kotlin.code.style=official
